<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="flow1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flow2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Full Background Frame -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Abstract Scent / Leaves Flow -->
  <path d="M 0,512 C 150,400 250,200 512,100 L 512,200 C 300,300 200,450 0,512 Z" fill="url(#flow1)" filter="blur(8px)"/>
  <path d="M 512,512 C 400,350 250,250 -50,150 L -50,50 C 300,150 450,450 512,512 Z" fill="url(#flow2)" filter="blur(6px)"/>
  
  <!-- Elegant 'W' -->
  <g transform="translate(256, 265)" filter="url(#glow)">
    <path d="M -80 -80 L -35 70 L 0 -10 L 35 70 L 80 -80" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
