<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16a34a" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#ffffff" />
  
  <g transform="translate(256, 260)" filter="url(#shadow)">
    <!-- First layer (back) -->
    <path d="M 0 0 C 100 -120, 100 -200, 0 -200 C -100 -200, -100 -120, 0 0 Z" fill="url(#grad1)" opacity="0.85" transform="rotate(60)" />
    <path d="M 0 0 C 100 -120, 100 -200, 0 -200 C -100 -200, -100 -120, 0 0 Z" fill="url(#grad2)" opacity="0.85" transform="rotate(180)" />
    <path d="M 0 0 C 100 -120, 100 -200, 0 -200 C -100 -200, -100 -120, 0 0 Z" fill="url(#grad1)" opacity="0.85" transform="rotate(300)" />
    
    <!-- Central inner core -->
    <circle cx="0" cy="-6" r="16" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
