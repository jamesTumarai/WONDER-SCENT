<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B8A9"/>
      <stop offset="50%" stop-color="#C59384"/>
      <stop offset="100%" stop-color="#B27B6E"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9F9F9"/>
    </radialGradient>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  
  <!-- Flower Icon -->
  <g transform="translate(256, 180) scale(1.5)" fill="none" stroke="url(#roseGold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Drop -->
    <path d="M 0 -70 C 10 -55, 15 -45, 15 -35 C 15 -25, 5 -15, 0 -15 C -5 -15, -15 -25, -15 -35 C -15 -45, -10 -55, 0 -70 Z" />
    
    <!-- Left Leaf -->
    <path d="M -5 -20 C -25 -20, -45 -35, -45 -50 C -45 -10, -10 10, -5 20" />
    
    <!-- Right Leaf -->
    <path d="M 5 -20 C 25 -20, 45 -35, 45 -50 C 45 -10, 10 10, 5 20" />
    
    <!-- Stems / Swirls -->
    <path d="M -5 20 C -20 40, -50 20, -35 5 C -20 -10, 0 10, 5 30 C 10 50, 20 60, 0 80" />
    <path d="M 5 30 C 20 15, 40 20, 50 30" />
    <path d="M -5 20 C 5 5, 15 5, 20 -5" />
  </g>

  <!-- Text -->
  <text x="256" y="400" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="500" letter-spacing="8" fill="#B27B6E" text-anchor="middle">WONDER</text>
  <text x="256" y="460" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="500" letter-spacing="8" fill="#B27B6E" text-anchor="middle">SCENT</text>
</svg>
