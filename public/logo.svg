<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#22c55e" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Black Background -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a" />
  
  <!-- Elegant "W" Letter -->
  <g transform="translate(256, 260)" filter="url(#glow)">
    <path d="M -110 -110 L -45 90 L 0 -10 L 45 90 L 110 -110" 
          fill="none" 
          stroke="url(#gradW)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
